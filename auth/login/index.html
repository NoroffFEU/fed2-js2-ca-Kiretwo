<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="/">
          <img
            src="/images/noroff-logo.png"
            alt="Noroff Logo"
            style="height: 40px"
          />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a
                href="/post/create/"
                id="create-post-button"
                class="nav-link hidden"
                >Create Post</a
              >
            </li>
            <li class="nav-item">
              <a href="/auth/login/" id="login-link" class="nav-link">Login</a>
            </li>
            <li class="nav-item">
              <a href="/auth/register/" id="register-link" class="nav-link"
                >Register</a
              >
            </li>
            <li class="nav-item">
              <button
                id="logout"
                class="nav-link btn btn-link hidden"
                style="cursor: pointer"
              >
                Logout
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- Login Form -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <h1 class="mb-4 text-center fw-bold">Login</h1>
          <form name="login" class="needs-validation" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                id="email"
                type="email"
                name="email"
                class="form-control"
                required
              />
              <div class="invalid-feedback">Please enter a valid email.</div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                name="password"
                id="password"
                class="form-control"
                required
              />
              <div class="invalid-feedback">Please enter your password.</div>
            </div>
            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-primary">Login</button>
            </div>
            <p class="text-center">
              Don't have an account? <a href="/auth/register/">Register</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
