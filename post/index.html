<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Page | Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="post-detail-page">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="/">
          <img
            src="/images/noroff-logo.png"
            alt="Noroff Logo"
            style="height: 40px"
          />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a href="/profile/" class="nav-link">My Profile</a>
            </li>
            <li class="nav-item">
              <a
                href="/post/create/"
                id="create-post-button"
                class="nav-link hidden"
                >Create Post</a
              >
            </li>
            <li class="nav-item">
              <a href="/auth/login/" id="login-link" class="nav-link">Login</a>
            </li>
            <li class="nav-item">
              <a href="/auth/register/" id="register-link" class="nav-link"
                >Register</a
              >
            </li>
            <li class="nav-item">
              <button
                id="logout"
                class="nav-link btn btn-link hidden"
                style="cursor: pointer"
              >
                Logout
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- Post Detail -->
    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div id="post-detail">
            <!-- Post detail content will be dynamically injected here -->
          </div>
        </div>
      </div>
      <div class="text-center">
        <a href="/" class="btn btn-secondary mt-4">Back to Home</a>
      </div>
    </main>
  </body>
</html>
